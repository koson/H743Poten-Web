<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclic Voltammetry Monitor</title>
    <script src="chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .control-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 15px;
            padding: 0 30px 30px;
            background: #f8f9fa;
        }
        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #startBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        #stopBtn {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        #clearBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: white;
            border-top: 2px solid #f0f0f0;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
        }
        .status-label {
            font-weight: 600;
            color: #666;
        }
        .status-value {
            font-weight: 700;
            color: #667eea;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            display: inline-block;
        }
        .status-indicator.running {
            background: #38ef7d;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .chart-container {
            padding: 30px;
            background: white;
        }
        #cvChart {
            max-height: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cyclic Voltammetry Monitor</h1>
            <p>Real-Time Data Acquisition - 10 Hz Streaming</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Start Voltage (V)</label>
                <input type="number" id="startV" value="-0.5" step="0.1">
            </div>
            <div class="control-group">
                <label>End Voltage (V)</label>
                <input type="number" id="endV" value="0.5" step="0.1">
            </div>
            <div class="control-group">
                <label>Scan Rate (V/s)</label>
                <input type="number" id="scanRate" value="0.1" step="0.01">
            </div>
            <div class="control-group">
                <label>Data Points</label>
                <input type="number" id="dataPoints" value="400" step="10">
            </div>
            <div class="control-group">
                <label>Cycles</label>
                <input type="number" id="cycles" value="1" step="1">
            </div>
        </div>

        <div class="button-group">
            <button id="startBtn" onclick="startScan()">🚀 Start Scan</button>
            <button id="stopBtn" onclick="stopScan()">🛑 Stop Scan</button>
            <button id="clearBtn" onclick="clearData()">🗑️ Clear Data</button>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-indicator" id="statusIndicator"></span>
                <span class="status-value" id="statusText">Idle</span>
            </div>
            <div class="status-item">
                <span class="status-label">Data Points:</span>
                <span class="status-value" id="dataCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Sampling:</span>
                <span class="status-value">10 Hz</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="cvChart"></canvas>
        </div>
    </div>

    <script>
        const API_BASE = 'http://192.168.9.75:5000/api/cv';
        let pollingInterval = null;
        let chart = null;

        // Initialize Chart
        const ctx = document.getElementById('cvChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Cyclic Voltammogram',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.5)',
                    showLine: true,
                    pointRadius: 2,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                animation: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: {
                            display: true,
                            text: 'Voltage (V)',
                            font: { size: 14, weight: 'bold' }
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Current (A)',
                            font: { size: 14, weight: 'bold' }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                }
            }
        });

        async function startScan() {
            const config = {
                startVoltage: parseFloat(document.getElementById('startV').value),
                endVoltage: parseFloat(document.getElementById('endV').value),
                scanRate: parseFloat(document.getElementById('scanRate').value),
                dataPoints: parseInt(document.getElementById('dataPoints').value),
                cycles: parseInt(document.getElementById('cycles').value),
                useRealDMM: true
            };

            const response = await fetch(`${API_BASE}/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });

            const result = await response.json();
            if (result.success) {
                startPolling();
            }
        }

        async function stopScan() {
            await fetch(`${API_BASE}/stop`, { method: 'POST' });
            stopPolling();
        }

        async function clearData() {
            await fetch(`${API_BASE}/clear`, { method: 'POST' });
            chart.data.datasets[0].data = [];
            chart.update('none');
            document.getElementById('dataCount').textContent = '0';
        }

        function startPolling() {
            if (pollingInterval) return;
            pollingInterval = setInterval(async () => {
                await updateStatus();
                await fetchNewData();
            }, 100); // Poll every 100ms
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        async function updateStatus() {
            const response = await fetch(`${API_BASE}/status`);
            const status = await response.json();
            
            const statusText = document.getElementById('statusText');
            const statusIndicator = document.getElementById('statusIndicator');
            const dataCount = document.getElementById('dataCount');

            if (status.running) {
                statusText.textContent = 'Running';
                statusIndicator.classList.add('running');
            } else {
                statusText.textContent = 'Idle';
                statusIndicator.classList.remove('running');
                stopPolling();
            }

            dataCount.textContent = status.dataPoints;
        }

        async function fetchNewData() {
            const response = await fetch(`${API_BASE}/data`);
            const newData = await response.json();

            if (newData.length > 0) {
                newData.forEach(point => {
                    chart.data.datasets[0].data.push({
                        x: point.voltage,
                        y: point.current
                    });
                });
                chart.update('none');
            }
        }

        // Initial status check
        updateStatus();
    </script>
</body>
</html>
