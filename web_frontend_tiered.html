<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H743 Potentiostat - Tiered Architecture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .status-measuring { background-color: #ffc107; }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .progress-custom {
            height: 25px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        
        .api-endpoint {
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    🧪 H743 Potentiostat 
                    <small class="text-muted">(Tiered Architecture)</small>
                </h1>
            </div>
        </div>

        <!-- Architecture Status Row -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">🏗️ System Architecture</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span>SCPI Server</span>
                            <span id="scpi-status" class="badge bg-secondary">Checking...</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span>STM32 Device</span>
                            <span id="device-status" class="badge bg-secondary">Checking...</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span>Web Frontend</span>
                            <span class="badge bg-success">Active</span>
                        </div>
                        <hr>
                        <small class="text-muted">
                            API: <span class="api-endpoint" id="api-url">http://localhost:8081</span>
                        </small>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">🔧 System Controls</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success btn-sm mb-2 w-100" onclick="connectDevice()">
                            🔌 Connect STM32
                        </button>
                        <button class="btn btn-warning btn-sm mb-2 w-100" onclick="disconnectDevice()">
                            🔌 Disconnect STM32
                        </button>
                        <button class="btn btn-info btn-sm w-100" onclick="testSCPICommand()">
                            🧪 Test SCPI Command
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CV Measurement Row -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">⚡ CV Measurement</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Measurement Status:</label>
                            <div>
                                <span id="cv-status-indicator" class="status-indicator status-disconnected"></span>
                                <span id="cv-status-text">Not Started</span>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Progress:</label>
                            <div class="progress">
                                <div id="cv-progress-bar" class="progress-bar progress-custom" 
                                     style="width: 0%">0%</div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Data Points:</label>
                            <div class="h4 text-primary" id="data-count">0</div>
                        </div>
                        
                        <button class="btn btn-success w-100 mb-2" onclick="startCV()">
                            🚀 Start CV Measurement
                        </button>
                        <button class="btn btn-danger w-100" onclick="stopCV()">
                            ⏹️ Stop CV Measurement
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">📊 Real-time CV Plot</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="cvChart" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Console Log -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">📝 System Console</h5>
                    </div>
                    <div class="card-body">
                        <pre id="console-log" style="height: 200px; overflow-y: scroll; background: #1e1e1e; color: #00ff00; padding: 10px; font-size: 12px;"></pre>
                        <button class="btn btn-secondary btn-sm" onclick="clearConsole()">Clear Console</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const SCPI_SERVER_URL = 'http://192.168.9.76:8081';  // Pi SCPI Server
        let cvChart = null;
        let statusPolling = null;

        // Initialize Chart
        function initChart() {
            const ctx = document.getElementById('cvChart').getContext('2d');
            cvChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'CV Curve',
                        data: [],
                        borderColor: 'rgb(102, 126, 234)',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: { display: true, text: 'Voltage (V)' }
                        },
                        y: {
                            title: { display: true, text: 'Current (A)' }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Cyclic Voltammetry'
                        }
                    }
                }
            });
        }

        // Console logging
        function log(message, type = 'info') {
            const console = document.getElementById('console-log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            console.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console-log').textContent = '';
        }

        // API Helper
        async function apiCall(endpoint, method = 'GET', data = null) {
            try {
                const options = {
                    method: method,
                    headers: { 'Content-Type': 'application/json' }
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                const response = await fetch(`${SCPI_SERVER_URL}${endpoint}`, options);
                return await response.json();
            } catch (error) {
                log(`API Error (${endpoint}): ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }

        // Status Polling
        async function updateStatus() {
            const status = await apiCall('/status');
            
            if (status.server_status) {
                document.getElementById('scpi-status').textContent = 'Running';
                document.getElementById('scpi-status').className = 'badge bg-success';
                
                if (status.device_connected) {
                    document.getElementById('device-status').textContent = `Connected (${status.device_port})`;
                    document.getElementById('device-status').className = 'badge bg-success';
                } else {
                    document.getElementById('device-status').textContent = 'Disconnected';
                    document.getElementById('device-status').className = 'badge bg-danger';
                }
                
                // Update CV status
                if (status.cv_running) {
                    document.getElementById('cv-status-indicator').className = 'status-indicator status-measuring';
                    document.getElementById('cv-status-text').textContent = 'Measuring...';
                    document.getElementById('cv-progress-bar').style.width = `${status.cv_progress}%`;
                    document.getElementById('cv-progress-bar').textContent = `${status.cv_progress}%`;
                } else {
                    document.getElementById('cv-status-indicator').className = 'status-indicator status-connected';
                    document.getElementById('cv-status-text').textContent = 'Ready';
                }
            } else {
                document.getElementById('scpi-status').textContent = 'Not Running';
                document.getElementById('scpi-status').className = 'badge bg-danger';
                document.getElementById('device-status').textContent = 'Unknown';
                document.getElementById('device-status').className = 'badge bg-secondary';
            }
        }

        // Device Controls
        async function connectDevice() {
            log('Connecting to STM32...');
            const result = await apiCall('/connect', 'POST');
            
            if (result.success) {
                log(`Connected successfully: ${result.message}`, 'success');
            } else {
                log(`Connection failed: ${result.message}`, 'error');
            }
            
            updateStatus();
        }

        async function disconnectDevice() {
            log('Disconnecting from STM32...');
            const result = await apiCall('/disconnect', 'POST');
            
            if (result.success) {
                log('Disconnected successfully', 'success');
            } else {
                log(`Disconnect failed: ${result.message}`, 'error');
            }
            
            updateStatus();
        }

        async function testSCPICommand() {
            log('Testing SCPI command (*IDN?)...');
            const result = await apiCall('/command', 'POST', { command: '*IDN?' });
            
            if (result.success) {
                log(`SCPI Response: ${result.response}`, 'success');
            } else {
                log(`SCPI Error: ${result.error}`, 'error');
            }
        }

        // CV Measurement
        async function startCV() {
            log('Starting CV measurement...');
            const result = await apiCall('/cv/start', 'POST');
            
            if (result.success) {
                log('CV measurement started successfully', 'success');
                // Start polling for data
                startDataPolling();
            } else {
                log(`CV start failed: ${result.error}`, 'error');
            }
        }

        async function stopCV() {
            log('Stopping CV measurement...');
            const result = await apiCall('/cv/stop', 'POST');
            
            if (result.success) {
                log('CV measurement stopped', 'success');
                stopDataPolling();
            } else {
                log(`CV stop failed: ${result.error}`, 'error');
            }
        }

        let dataPolling = null;

        function startDataPolling() {
            if (dataPolling) return;
            
            dataPolling = setInterval(async () => {
                const data = await apiCall('/cv/data');
                
                if (data.success && data.data) {
                    // Update chart
                    cvChart.data.datasets[0].data = data.data.map(point => ({
                        x: point.voltage,
                        y: point.current
                    }));
                    cvChart.update();
                    
                    // Update data count
                    document.getElementById('data-count').textContent = data.count;
                    
                    if (data.count > 0) {
                        log(`Received ${data.count} data points`);
                    }
                }
            }, 1500); // Poll every 1.5 seconds
        }

        function stopDataPolling() {
            if (dataPolling) {
                clearInterval(dataPolling);
                dataPolling = null;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 H743 Potentiostat Web Frontend Started (Tiered Architecture)');
            log(`🔗 Connecting to SCPI Server: ${SCPI_SERVER_URL}`);
            
            initChart();
            updateStatus();
            
            // Start status polling
            statusPolling = setInterval(updateStatus, 3000);
            
            // Update API URL display
            document.getElementById('api-url').textContent = SCPI_SERVER_URL;
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (statusPolling) clearInterval(statusPolling);
            if (dataPolling) clearInterval(dataPolling);
        });
    </script>
</body>
</html>
